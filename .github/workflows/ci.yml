name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect codebase
        id: app
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json не найден — этап проектирования, JS-проверки пропущены."
          fi

      - name: Setup Node
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: yarn install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        if: steps.app.outputs.present == 'true'
        run: yarn lint

      - name: Typecheck (tsc --noEmit)
        if: steps.app.outputs.present == 'true'
        run: yarn typecheck

      - name: Typecheck app (Expo/RN)
        if: steps.app.outputs.present == 'true'
        run: yarn typecheck:app

      - name: Tests (Jest)
        if: steps.app.outputs.present == 'true'
        run: yarn test --ci --coverage

      - name: Upload coverage
        if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: steps.app.outputs.present == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          # Tokenless on public repos; never fail CI if Codecov is unreachable/unconfigured.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: app
    # Debug-сборку гоняем на push в интеграционные ветки, не на каждом PR.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Detect Expo app
        id: app
        run: |
          if [ -f package.json ] && [ -f app.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Expo-приложение не найдено — Android-сборка пропущена."
          fi

      - name: Setup Node
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: yarn install --frozen-lockfile

      - name: Setup JDK 17
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        if: steps.app.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      # Каталог android/ в .gitignore — генерируем его из app.json перед сборкой.
      - name: Prebuild native Android project
        if: steps.app.outputs.present == 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        if: steps.app.outputs.present == 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore