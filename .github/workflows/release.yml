name: Release

# Срабатывает при пуше тега вида vX.Y.Z (см. SemVer в docs/architecture/06-development.md).
# Собирает релизные артефакты Android и публикует GitHub Release.
#
# Каталог android/ в .gitignore — он генерируется из app.json шагом `expo prebuild`
# перед сборкой. До появления Expo-приложения джоб просто создаёт GitHub Release
# по тегу (без артефактов).
#
# Для подписи релиза задайте секреты репозитория:
#   ANDROID_KEYSTORE_BASE64    — keystore (.jks), закодированный base64
#   ANDROID_KEYSTORE_PASSWORD  — пароль keystore
#   ANDROID_KEY_ALIAS          — алиас ключа
#   ANDROID_KEY_PASSWORD       — пароль ключа
# Если секреты не заданы, шаги подписи пропускаются.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Expo app
        id: app
        run: |
          if [ -f package.json ] && [ -f app.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Expo-приложение не найдено — будет создан GitHub Release без артефактов."
          fi

      - name: Setup Node
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: yarn install --frozen-lockfile

      - name: Setup JDK 17
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        if: steps.app.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      # Каталог android/ в .gitignore — генерируем его из app.json перед сборкой.
      - name: Prebuild native Android project
        if: steps.app.outputs.present == 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore
        if: steps.app.outputs.present == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build release bundle (AAB) and APK
        if: steps.app.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
