name: PR Title

# Проверяет, что заголовок pull request соответствует Conventional Commits
# (см. docs/architecture/06-development.md#143-соглашения-о-коммитах-и-ветках).
# Заголовок PR становится сообщением squash-коммита, поэтому держим его в формате.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Разрешённые типы из соглашения о коммитах проекта.
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            chore
            ci
            build
            style
            revert
            balance
