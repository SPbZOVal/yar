version: 2

updates:
  # Версии GitHub Actions в .github/workflows — активно уже сейчас.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci

